name: Verfügbarkeit abfragen
on:
  workflow_dispatch:
concurrency:
  group: shop-abfrage
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  abfragen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install curl_cffi
      - name: Shops abfragen
        run: python3 scripts/shops.py
      - run: python3 scripts/build.py
      - name: Ergebnis committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git commit -m "Preise und Verfügbarkeit aktualisiert ($(date +'%d.%m.%Y %H:%M'))" || echo "Keine Änderungen"
          git push
  veroeffentlichen:
    needs: abfragen
    uses: ./.github/workflows/pages.yml
