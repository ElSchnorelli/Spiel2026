name: probe
on:
  push:
    branches: [shop-abfrage]
    paths: [scripts/shops.py, .github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install curl_cffi
      - run: |
          cd scripts && python3 -c "
          import shops
          for f in (shops.so_search, shops.st_search, shops.sf_search):
              for q in ('Shugendo','Endeavor'):
                  print(f.__name__, q, f(q)[:6])
          "
      - run: python3 scripts/shops.py 14 20 37 48
